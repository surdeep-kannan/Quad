name: quad
description: "Quad - the student community app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # UI
  material_ui: ^1.2.0
  cupertino_ui: ^1.0.2
  cached_network_image: ^4.0.2

  # State and navigation
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1

  # Backend
  supabase_flutter: ^2.17.2

  # Media, files and calls
  image_picker: ^1.2.3
  file_picker: ^13.1.0
  video_player: ^2.14.0
  mime: ^2.1.0

  # Utilities
  intl: ^0.20.2
  share_plus: ^13.3.0
  url_launcher: ^6.3.2
  uuid: ^4.6.0
  livekit_client: ^2.13.0
  shared_preferences: ^2.5.5
  flutter_foreground_task: ^11.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree-Regular.ttf
          weight: 400
        - asset: assets/fonts/Figtree-Medium.ttf
          weight: 500
        - asset: assets/fonts/Figtree-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Figtree-Bold.ttf
          weight: 700
        - asset: assets/fonts/Figtree-ExtraBold.ttf
          weight: 800
    - family: Bricolage
      fonts:
        - asset: assets/fonts/BricolageGrotesque-Medium.ttf
          weight: 500
        - asset: assets/fonts/BricolageGrotesque-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BricolageGrotesque-Bold.ttf
          weight: 700
        - asset: assets/fonts/BricolageGrotesque-ExtraBold.ttf
          weight: 800
    # Phosphor icons (MIT), used through lib/core/widgets/app_icons.dart.
    - family: PhosphorRegular
      fonts:
        - asset: assets/fonts/Phosphor-Regular.ttf
    - family: PhosphorFill
      fonts:
        - asset: assets/fonts/Phosphor-Fill.ttf
    - family: PhosphorBold
      fonts:
        - asset: assets/fonts/Phosphor-Bold.ttf
